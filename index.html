<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <meta name="description" content="CNews et Europe 1 en direct, TV et radio, avec les dernières dépêches" />
  <title>CNews & Europe 1 · Direct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="app-title">Flux Médias</h1>
    </header>

    <main class="content">
      <!-- TV player (visible only while CNews TV is active) -->
      <section class="tv-stage" id="tv-stage" hidden>
        <div class="tv-frame" id="tv-frame"></div>
      </section>

      <section class="section" aria-labelledby="stations-title">
        <h2 class="section-title" id="stations-title">En direct</h2>
        <div class="stations" id="stations"></div>
      </section>

      <section class="section" aria-labelledby="news-title">
        <div class="section-head">
          <h2 class="section-title" id="news-title">Dépêches</h2>
          <button class="icon-btn" id="news-refresh" type="button" aria-label="Actualiser les dépêches">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div class="segmented" id="news-tabs" role="tablist">
          <button type="button" role="tab" class="active" data-source="all">Tout</button>
          <button type="button" role="tab" data-source="cnews">CNews</button>
          <button type="button" role="tab" data-source="europe1">Europe 1</button>
        </div>
        <div class="news-list" id="news-list">
          <p class="news-empty">Chargement des dépêches…</p>
        </div>
      </section>
    </main>

    <!-- Now playing bar: pause / resume / stop, always within thumb reach -->
    <div class="now-playing" id="now-playing" hidden>
      <div class="np-art" id="np-art"></div>
      <div class="np-meta">
        <span class="np-title" id="np-title"></span>
        <span class="np-status" id="np-status"></span>
      </div>
      <button class="np-btn np-toggle" id="np-toggle" type="button" aria-label="Pause"></button>
      <button class="np-btn np-stop" id="np-stop" type="button" aria-label="Arrêter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
    </div>
  </div>

  <!-- Article sheet -->
  <div class="sheet-overlay" id="article-sheet" aria-hidden="true">
    <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="article-title">
      <div class="sheet-head">
        <span class="news-source" id="article-source"></span>
        <span class="news-time" id="article-time"></span>
        <button class="icon-btn sheet-close" id="article-close" type="button" aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <img class="article-img" id="article-img" alt="" hidden />
        <h3 class="article-title" id="article-title"></h3>
        <div class="article-content" id="article-content"></div>
        <p class="article-status" id="article-status" hidden></p>
        <a class="article-link" id="article-link" href="#" target="_blank" rel="noopener">Voir sur le site</a>
      </div>
    </article>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
